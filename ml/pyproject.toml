[project]
name = "kindra"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "duckdb>=1.0", "geopandas>=1.0",
  "shapely>=2.0", "requests>=2.31", "tqdm>=4.66", "python-dotenv>=1.0", "scikit-learn>=1.4",
  "lightgbm>=4.3", "matplotlib>=3.8", "typer>=0.12",
  "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "geoalchemy2>=0.15"]
[project.optional-dependencies]
dev = ["pytest>=8", "jupyterlab>=4"]
