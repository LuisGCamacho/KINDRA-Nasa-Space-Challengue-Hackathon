[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kindra"
version = "0.5.0"
description = "Serie armonizada de focos de calor MODIS + VIIRS, próximas 24 h y agente de cámaras"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "duckdb>=1.1",
  "pyarrow>=17",
  "geopandas>=1.0",
  "shapely>=2.0",
  "requests>=2.32",
  "typer>=0.12",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "geoalchemy2>=0.15",
  "python-dotenv>=1.0",
  # KINDRA 4: cámaras, visión y agente
  "pydantic>=2.8",
  "opencv-python>=4.10",
  "ultralytics>=8.3",
  "huggingface-hub>=0.24",  # baja los pesos de Pyronear y de rabahdev
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter>=1.0", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
include = ["kindra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
